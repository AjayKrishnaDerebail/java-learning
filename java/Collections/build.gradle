plugins {
    id 'java'
    id 'application'
}

group = 'com.collections'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.collections.main.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.collections.main.Main'
    }
}