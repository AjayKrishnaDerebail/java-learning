plugins {
    id 'java'
    id 'application'
}

group = 'com.io.operations'
version = '1.0.0'

repositories {
    mavenCentral()
}

/**
 * ✅ DEPENDENCIES – FULLY COMPATIBLE WITH:
 * - Java 25
 * - Gradle 9.2.1
 * - IntelliJ 2025+
 */
dependencies {

    // ✅ Lombok (Java 25 compatible)
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    // ✅ Logging
    implementation 'ch.qos.logback:logback-classic:1.5.21'
}

/**
 * ✅ FORCE GRADLE + INTELLIJ TO USE JAVA 25 TOOLCHAIN
 */
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

/**
 * ✅ APPLICATION ENTRY POINT
 */
application {
    mainClass = 'com.main.App'
}

/**
 * ✅ FAT JAR CONFIG (Runnable JAR)
 */
tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'com.main.App'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}