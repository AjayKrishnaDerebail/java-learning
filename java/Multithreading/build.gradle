plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

ext {
    lombokVersion = '1.18.38'
    junitJupiterVersion = '5.12.0'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Keep existing folder layout: sources live in ./src
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = []
        }
    }
    test {
        java {
            srcDirs = []
        }
        resources {
            srcDirs = []
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // If you later use preview features, uncomment:
    // options.compilerArgs += ['--enable-preview']
}

tasks.withType(JavaExec).configureEach {
    // If you later use preview features, uncomment:
    // jvmArgs += ['--enable-preview']
}

tasks.named('test') {
    useJUnitPlatform()
}

// Set this once you decide the entrypoint you want to run.
// You currently have classes with a `static void main()` but no `public static void main(String[] args)`.
application {
    // mainClass = 'com.udemy.course.one.CourseOneMain'
}
